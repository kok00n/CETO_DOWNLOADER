name: Refresh MF data (bond_specs + bond_outstanding)

on:
  schedule:
    # Codziennie pon-pt o 06:00 UTC = 07:00 (CET) / 08:00 (CEST).
    # MF aktualizuje XLSM po przetargach (zwykle wtorki/srody) z 1-dniowym
    # opoznieniem; codzienny refresh laczy zarowno nowe specs jak i swieze
    # outstanding w 24h od kazdej operacji.
    - cron: '0 6 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: refresh-mf-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh bond_specs (static bond data)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/refresh_bond_specs.py

      - name: Refresh bond_outstanding (issuance history)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/refresh_bond_outstanding.py

      - name: Refresh tbill data (specs + outstanding)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/refresh_tbill_data.py

      - name: Refresh bond_auctions (auction events from Operacje)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/refresh_bond_auctions.py

      # Reference rates (WIBOR6M / POLSTR / CPI) odswiezane przez osobny
      # workflow refresh_reference_rates.yml (1x/dzien pn-pt 18:00 UTC).

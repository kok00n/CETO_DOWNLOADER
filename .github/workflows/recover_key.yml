name: Recover STOOQ key
on:
  workflow_dispatch: {}
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: dump secret to a file
        env:
          STOOQ_API_KEY: ${{ secrets.STOOQ_API_KEY }}
        run: printf '%s' "$STOOQ_API_KEY" > stooq_key.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stooq-key
          path: stooq_key.txt
          retention-days: 1
